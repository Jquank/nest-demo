# ============================================================
# Nginx 配置文件
# 路径：/etc/nginx/conf.d/nest-demo.conf
# 用法：sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ---- 上游 API 服务 ----
upstream nest_api {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    # 有域名的话，把下面注释去掉，改成你的域名
    # server_name example.com www.example.com;
    server_name _;

    # 日志
    access_log /var/log/nginx/nest-demo-access.log;
    error_log /var/log/nginx/nest-demo-error.log;

    # 上传文件大小限制（上传图片）
    client_max_body_size 20m;

    # ---- 前端静态文件 ----
    # 把 web 项目 build 后的 dist 目录放到 /home/nest-demo/web-dist
    root /home/nest-demo/web-dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # ---- API 代理 ----
    location /api/ {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---- Board 代理 ----
    location /board/ {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 上传文件 ----
    location /uploads/ {
        alias /home/nest-demo/uploads/;
        # 图片缓存 7 天
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---- gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
}
